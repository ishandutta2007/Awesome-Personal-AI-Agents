<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#181135" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#f472b6;#38bdf8" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#38bdf8;#818cf8;#a855f7" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#818cf8;#c084fc;#ec4899" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Elements (Deep layer) -->
  <g id="background-dynamics">
    <!-- Animated Orb 1 (Top Left) -->
    <circle cx="180" cy="100" r="160" fill="url(#glowCyan)">
      <animate attributeName="cx" values="180;230;180" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;140;100" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="160;190;160" dur="7s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Orb 2 (Right Center) -->
    <circle cx="1020" cy="180" r="200" fill="url(#glowPurple)">
      <animate attributeName="cx" values="1020;970;1020" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="180;130;180" dur="9s" repeatCount="indefinite" />
      <animate attributeName="r" values="200;170;200" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Orb 3 (Bottom Center) -->
    <circle cx="600" cy="320" r="140" fill="url(#glowPink)">
      <animate attributeName="cy" values="320;290;320" dur="9s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;170;140" dur="6s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Data Flow Lines (Behind text layer) -->
    <path d="M 50 80 Q 300 20 600 80 T 1150 60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 12">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="14s" repeatCount="indefinite" />
    </path>
    <path d="M 50 320 Q 400 370 700 310 T 1150 330" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" from="0" to="240" dur="16s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Animated Feature Nodes / Pills (Carefully perimeter-placed so title remains completely clear) -->
  <g id="animated-perimeter-badges" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <!-- Top-left tag -->
    <g transform="translate(70, 42)">
      <rect width="180" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="20" fill="#93c5fd">🧠 Stateful Memory</text>
    </g>

    <!-- Top-right tag -->
    <g transform="translate(940, 42)">
      <rect width="190" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
      <circle cx="16" cy="15" r="4" fill="#c084fc">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="20" fill="#e9d5ff">⚡ Autonomous Action</text>
    </g>

    <!-- Bottom-left tag -->
    <g transform="translate(70, 316)">
      <rect width="190" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
      <circle cx="16" cy="15" r="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="20" fill="#a7f3d0">🔒 Self-Hosted Privacy</text>
    </g>

    <!-- Bottom-right tag -->
    <g transform="translate(940, 316)">
      <rect width="190" height="30" rx="15" fill="#1e293b" fill-opacity="0.8" stroke="#f472b6" stroke-width="1.2" stroke-opacity="0.6" filter="url(#shadow)" />
      <circle cx="16" cy="15" r="4" fill="#f472b6">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="20" fill="#fbcfe8">🌐 Browser &amp; App Control</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT (High Contrast, Guaranteed Never Obscured) -->
  <g id="foreground-content" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- Top Pill Category Badge -->
    <g transform="translate(600, 75)">
      <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" filter="url(#shadow)" />
      <text y="5" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="2">✨ CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1" filter="url(#shadow)">
      Awesome Personal AI Agents
    </text>

    <!-- Subtitle -->
    <text x="600" y="206" font-size="20" font-weight="500" fill="#e2e8f0" letter-spacing="0.3">
      The Ultimate Directory of Autonomous Systems, Self-Improving Memory &amp; AI Assistants
    </text>

    <!-- Secondary Meta Description -->
    <text x="600" y="238" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Tracking Frontier SaaS Platforms &amp; Open-Source Projects • Omnichannel • Browser-Use • Cross-Device
    </text>

    <!-- Stats / Pillars Bar in Foreground -->
    <g transform="translate(600, 275)">
      <rect x="-350" y="0" width="700" height="38" rx="19" fill="#0b0f19" fill-opacity="0.92" stroke="#334155" stroke-width="1" filter="url(#shadow)" />
      
      <text x="-230" y="24" font-size="13" font-weight="600" fill="#38bdf8">⭐ 15+ Open Source Leaders</text>
      <circle cx="-110" cy="19" r="3" fill="#475569" />
      <text x="0" y="24" font-size="13" font-weight="600" fill="#a855f7">🚀 Top Tier SaaS Platforms</text>
      <circle cx="110" cy="19" r="3" fill="#475569" />
      <text x="230" y="24" font-size="13" font-weight="600" fill="#34d399">🔄 Updated Daily &amp; Active</text>
    </g>
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>